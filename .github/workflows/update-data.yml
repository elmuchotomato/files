name: Update labour data

on:
  schedule:
    # SECO publishes around the 7th each month; run on the 9th to be safe.
    - cron: "0 6 9 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pull SECO bulletins
        run: python fetch_seco.py --months 36

      - name: Publish data for the dashboard
        run: cp data/labour.json docs/labour.json

      - name: Commit if anything changed
        run: |
          git config user.name  "labour-bot"
          git config user.email "labour-bot@users.noreply.github.com"
          git add data/labour.json docs/labour.json
          git diff --staged --quiet || git commit -m "Refresh labour data ($(date +%Y-%m))"
          git push
